document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Seen }}<\u002Fspan>\n          <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <!-- ============ SCAN HISTORY ============ -->\n      <sc-if value=\"{{ isScans }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex; flex-direction:column; gap:16px;\">\n        <div style=\"display:flex; align-items:center; gap:14px; padding:16px 22px; border-radius:14px; background:linear-gradient(180deg,#161c27,#11151e); border:1px solid #242c3a;\">\n          <span style=\"display:flex; width:34px; height:34px; border-radius:9px; align-items:center; justify-content:center; background:rgba(92,180,221,.14); border:1px solid rgba(92,180,221,.34); color:#7fcdec;\"><svg width=\"17\" height=\"17\" viewBox=\"0 0 17 17\"><circle cx=\"8.5\" cy=\"8.5\" r=\"6.6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\"><\u002Fcircle><path d=\"M8.5 4.6v4l2.6 1.6\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpath><\u002Fsvg><\u002Fspan>\n          <div style=\"flex:1;\"><div style=\"font:700 14px 'Space Grotesk'; color:#eef3f8;\">{{ scansView.count }} scans this season<\u002Fdiv><div style=\"font:600 12px 'Hanken Grotesk'; color:#8a93a6;\">{{ scansView.first }} → {{ scansView.latest }} · click any snapshot to load it across the dashboard<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"border-radius:14px; background:linear-gradient(180deg,#161c27,#11151e); border:1px solid #242c3a; overflow:hidden;\">\n          <div style=\"display:grid; grid-template-columns:1.3fr 1.4fr 1fr 1.4fr 1fr 1.4fr 1fr; align-items:center; padding:12px 22px; background:#0f131b; border-bottom:1px solid #1d2433; font:700 10px 'Hanken Grotesk'; letter-spacing:.1em; color:#6f7889;\">\n            <span>SNAPSHOT<\u002Fspan><span style=\"text-align:right;\">POWER<\u002Fspan><span style=\"text-align:right;\">Δ<\u002Fspan><span style=\"text-align:right;    <sc-if value=\"{{ isDkpLab }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"display:flex; flex-direction:column; gap:18px;\">\n        <div style=\"display:grid; grid-template-columns:1.3fr 1fr; gap:18px;\">\n          <!-- controls -->\n          <div style=\"padding:22px; border-radius:16px; background:linear-gradient(180deg,#161c27,#11151e); border:1px solid #242c3a;\">\n            <div style=\"display:flex; align-items:center; gap:10px; margin-bottom:18px;\"><span style=\"width:8px; height:8px; background:#5cb4dd; transform:rotate(45deg);\"><\u002Fspan><span style=\"font:700 12px 'JetBrains Mono'; letter-spacing:.04em; color:#cfe4ef;\">DKP FORMULA<\u002Fspan><\u002Fdiv>\n            <div style=\"display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap;\">\n              <sc-for list=\"{{ dkpLab.presets }}\" as=\"p\" hint-placeholder-count=\"3\"><button onclick=\"{{ p.onClick }}\" style=\"padding:7px 14px; border-radius:8px; font:700 12px 'Hanken Grotesk'; cursor:pointer; background:{{ p.bg }}; border:1px solid {{ p.border }}; color:{{ p.txt }};\">{{ p.label }}<\u002Fbutton><\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:20px;\">\n              <div>\n                <div style=\"display:flex; justify-content:space-between; margin-bottom:9px;\"><span style=\"font:700 12px 'Hanken Grotesk'; color:#c9ccd6;\">Kill-point weight<\u002Fspan><span style=\"font:700 13px 'JetBrains Mono'; color:#5cb4dd;\">×{{ dkpLab.kpW }}<\u002Fspan><\u002Fdiv>\n                <input type=\"range\" min=\"0\" max=\"4\" step=\"0.5\" value=\"{{ dkpLab.kpW }}\" oninput=\"{{ dkpLab.onKpW }}\" style=\"width:100%; accent-color:#5cb4dd;\">\n              <\u002Fdiv>\n              <div>\n                <div style=\"display:flex; justify-content:space-between; margin-bottom:9px;\"><span style=\"font:700 12px 'Hanken Grotesk'; color:#c9ccd6;\">Dead-troop weight<\u002Fspan><span style=\"font:700 13px 'JetBrains Mono'; color:#5cb4dd;\">×{{ dkpLab.deathW }}<\u002Fspan><\u002Fdiv>\n                <input type=\"range\" min=\"0\" max=\"40\" step=\"1\" value=\"{{ dkpLab.deathW }}\" oninput=\"{{ dkpLab.onDeathW }}\" style=\"width:100%; accent-color:#5cb4dd;\">\n              <\u002Fdiv>\n              <div style=\"height:1px; background:#222a38;\"><\u002Fdiv>\n              <div>\n                <div style=\"display:flex; justify-content:space-between; margin-bottom:9px;\"><span style=\"font:700 12px 'Hanken Grotesk'; color:#c9ccd6;\">Goal per power<\u002Fspan><span style=\"font:700 13px 'JetBrains Mono'; color:#5cb4dd;\">×{{ dkpLab.goalPow }}<\u002Fspan><\u002Fdiv>\n                <input type=\"range\" min=\"1\" max=\"4\" step=\"0.05\" value=\"{{ dkpLab.goalPow }}\" oninput=\"{{ dkpLab.onGoalPow }}\" style=\"width:100%; accent-color:#5cb4dd;\">\n              <\u002Fdiv>\n              <div>\n                <div style=\"display:flex; justify-content:space-between; margin-bottom:9px;\"><span style=\"font:700 12px 'Hanken Grotesk'; color:#c9ccd6;\">Base requirement<\u002Fspan><span style=\"font:700 13px 'JetBrains Mono'; color:#5cb4dd;\">{{ dkpLab.goalBase }}M<\u002Fspan><\u002Fdiv>\n                <input type=\"range\" min=\"0\" max=\"60\" step=\"2\" value=\"{{ dkpLab.goalBase }}\" oninput=\"{{ dkpLab.onGoalBase }}\" style=\"width:100%; accent-color:#5cb4dd;\">\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"margin-top:20px; padding:14px 16px; border-radius:10px; background:#0f131b; border:1px solid #1d2433;\">\n              <div style=\"font:700 9.5px 'Hanken Grotesk'; letter-spacing:.1em; color:#6f7889; margin-bottom:6px;\">DKP =<\u002Fdiv>\n              <div style=\"font:600 13px 'JetBrains Mono'; color:#9fcfe4;\">{{ dkpLab.formula }}<\u002Fdiv>\n              <div style=\"margin-top:10px; font:700 9.5px 'Hanken Grotesk'; letter-spacing:.1em; color:#6f7889; margin-bottom:6px;\">GOAL =<\u002Fdiv>\n              <div style=\"font:600 13px 'JetBrains Mono'; color:#9fcfe4;\">{{ dkpLab.goalFormula }}<\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- result -->\n          <div style=\"padding:22px; border-radius:16px; background:linear-gradient(180deg,#161c27,#11151e); border:1px solid #242c3a; display:flex; flex-direction:column; align-items:center; justify-content:center;\">\n            <div style=\"font:700 11px 'Hanken Grotesk'; letter-spacing:.12em; color:#8a93a6; align-self:flex-start; margin-bottom:6px;\">GOVERNORS ON TARGET<\u002Fdiv>\n            <div style=\"position:relative; width:172px; height:172px; margin:8px 0;\">\n              <svg viewBox=\"0 0 120 120\" style=\"width:172px; height:172px; transform:rotate(-90deg);\"><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"none\" stroke=\"#222a38\" stroke-width=\"12\"><\u002Fcircle><circle cx=\"60\" cy=\"60\" r=\"50\" fill=\"none\" stroke=\"#5cb4dd\" stroke-width=\"12\" stroke-linecap=\"round\" stroke-dasharray=\"{{ dkpLab.reqDash }}\" style=\"filter:drop-shadow(0 0 7px rgba(92,180,221,.45));\"><\u002Fcircle><\u002Fsvg>\n              <div style=\"position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;\"><span style=\"font:700 38px 'JetBrains Mono'; color:#eef3f8;\">{{ dkpLab.metPct }}<\u002Fspan><span style=\"font:700 9px 'Hanken Grotesk'; letter-spacing:.1em; color:#8a93a6;\">MEET GOAL<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"display:flex; gap:30px; margin-top:14px;\">\n              <div style=\"text-align:center;\"><div style=\"font:700 24px 'JetBrains Mono'; color:#57c98e;\">{{ dkpLab.metCount }}<\u002Fdiv><div style=\"font:600 11px 'Hanken Grotesk'; color:#8a93a6;\">on target<\u002Fdiv><\u002Fdiv>\n              <div style=\"text-align:center;\"><div style=\"font:700 24px 'JetBrains Mono'; color:#d0828f;\">{{ dkpLab.missCount }}<\u002Fdiv><div style=\"font:600 11px 'Hanken Grotesk'; color:#8a93a6;\">below<\u002Fdiv><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"border-radius:14px; background:linear-gradient(180deg,#161c27,#11151e); border:1px solid #242c3a; overflow:hidden;\">\n          <div style=\"display:flex; align-items:center; gap:10px; padding:16px 22px 13px;\"><span style=\"width:8px; height:8px; background:#5cb4dd; transform:rotate(45deg);\"><\u002Fspan><span style=\"font:700 12px 'JetBrains Mono'; letter-spacing:.04em; color:#cfe4ef;\">LIVE PREVIEW · TOP GOVERNORS<\u002Fspan><\u002Fdiv>\n          <div style=\"padding:6px 14px 14px;\">\n            <sc-for list=\"{{ dkpLab.preview }}\" as=\"g\" hint-placeholder-count=\"8\">\n            <div style=\"display:grid; grid-template-columns:1.4fr 1fr 1.6fr 80px; align-items:center; gap:14px; padding:10px 10px; border-radius:9px;\">\n              <span style=\"display:flex; align-items:center; gap:9px; min-width:0;\"><span style=\"width:8px; height:8px; border-radius:2px; background:{{ g.allianceColor }}; transform:rotate(45deg);\"><\u002Fspan><span style=\"font:700 13.5px 'Hanken Grotesk'; color:#dfe7ef; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;\">{{ g.name }}<\u002Fspan><\u002Fspan>\n              <span style=\"font:700 13px 'JetBrains Mono'; color:#5cb4dd;\">{{ g.dkpFmt }}<\u002Fspan>\n              <span style=\"display:flex; align-items:center; gap:10px;\"><div style=\"flex:1; height:9px; border-radius:5px; background:#1b2230; overflow:hidden;\"><span style=\"display:block; height:100%; width:{{ g.barW }}; background:{{ g.barColor }}; border-radius:5px;\"><\u002Fspan><\u002Fdiv><span style=\"font:600 11px 'JetBrains Mono'; color:#8a93a6;\">/ {{ g.reqFmt }}<\u002Fspan><\u002Fspan>\n              <span style=\"text-align:right; font:700 12px 'JetBrains Mono'; color:{{ g.pctColor }};\">{{ g.pct }}<\u002Fspan>\n            <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    screen: 'landing',\n    view: 'dashboard',\n    selectedGov: null,\n    query: '',\n    sortKey: 'power',\n    sortDir: 'desc',\n    allianceFilter: 'all',\n    chartRange: 30,\n    scanIdx: 6,\n    kvkStart: 0,\n    kvkEnd: 6,\n    cmdType: 'all',\n    activityFilter: 'all',\n    memberFilter: 'all',\n    memberOverrides: this._loadJSON('kd1685_member_overrides', {}),\n    invites: this._loadJSON('kd1685_invites', []),\n    inviteRole: 'Member',\n    joinCode: '',\n    joinStatus: 'idle',\n    joinedRole: '',\n    dkpKpW: 1,\n    dkpDeathW: 15,\n    dkpGoalPerPow: 2.55,\n    dkpGoalBase: 18,\n  };\n\n  _data = this._build();\n\n  _rng(seed){ let s = seed >>> 0; return function(){ s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }\n\n  fmt(n){ n = Number(n) || 0; const a = Math.abs(n); if(a>=1e9) return (n/1e9).toFixed(2)+'B'; if(a>=1e6) return (n/1e6).toFixed(1)+'M'; if(a>=1e3) return (n/1e3).toFixed(1)+'K'; return String(Math.round(n)); }\n  fmtSigned(n){ return (n>=0?'+':'')+this.fmt(n); }\n  fmtFull(n){ return Math.round(Number(n)||0).toLocaleString('en-US'); }\n\n  // --- member tracking: persistence + officer actions (prototype, localStorage) ---\n  _loadJSON(k, fb){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch(e){ return fb; } }\n  _saveJSON(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }\n  _genCode(){ const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s=''; for(let i=0;i<6;i++) s+=a[Math.floor(Math.random()*a.length)]; return '1685-'+s; }\n  verifyMember(id){ const o={...this.state.memberOverrides}, cur=o[id]||{}; const base=this._data.governors.find(g=>g.id===id); const eff=cur.verified!==undefined?cur.verified:(base&&base.linked); o[id]={...cur, verified:!eff}; this._saveJSON('kd1685_member_overrides',o); this.setState({memberOverrides:o}); }\n  setMemberRole(id, role){ const o={...this.state.memberOverrides}; o[id]={...(o[id]||{}), role}; this._saveJSON('kd1685_member_overrides',o); this.setState({memberOverrides:o}); }\n  issueInvite(){ const inv=[{code:this._genCode(), role:this.state.inviteRole, created:Date.now(), used:false}, ...this.state.invites]; this._saveJSON('kd1685_invites',inv); this.setState({invites:inv}); }\n  revokeInvite(code){ const inv=this.state.invites.filter(i=>i.code!==code); this._saveJSON('kd1685_invites',inv); this.setState({invites:inv}); }\n  copyInvite(code){ try{ navigator.clipboard.writeText('https://kd1685.com/join?code='+code); }catch(e){} }\n  // --- member side: redeem an invite code ---\n  redeemInvite(){\n    const code=(this.state.joinCode||'').trim().toUpperCase();\n    if(!code){ this.setState({joinStatus:'empty'}); return; }\n    const inv=this.state.invites.find(i=>i.code.toUpperCase()===code && !i.used);\n    if(!inv){ this.setState({joinStatus:'invalid'}); return; }\n    const list=this.state.invites.map(i=>i.code===inv.code?{...i,used:true,usedAt:Date.now()}:i);\n    this._saveJSON('kd1685_invites',list);\n    this.setState({invites:list, joinStatus:'success', joinedRole:inv.role});\n  }\n\n  _build(){\n    const rnd = this._rng(168577);\n    const names = ['Aldric','Valyria','DragonReign','NightOwl','SunWukong','IvarTheBold','Seraphine','GreyWolf','Thalia','RagnarLo','Morrigan','Tariq','BjornAxe','Lysandra','KaelDrak','Octavia','Hyperion','Freyja','Cassius','NyxShade','Leonidas','Isolde','Drogo','Amara','CyrusVI','Ophelia','Garruk','Selene','MagnusRex','Rhiannon','TychoBahn','Eowyn','Boudica','Saladin','AstraVoid','VladImpa','MiraNova','OrionPax','Calista','Hadrian','YaraGrey','Zephyr','LucanBlack','AnyaStorm','Brennus','SifValkyr','DariusKn','Kato685'];\n    const alliances = [\n      {tag:'WW85', name:'Warriors of Wanna', color:'#5cb4dd', home:true},\n      {tag:'VLOR', name:'Valor Ascendant', color:'#6f86b0'},\n      {tag:'IRON', name:'Iron Vanguard', color:'#8793a4'},\n      {tag:'DAWN', name:'Dawnbreakers', color:'#3fb6a6'},\n      {tag:'HORD', name:'The Horde', color:'#7d83c4'},\n      {tag:'NOVA', name:'Nova Legion', color:'#5f9bb0'},\n    ];\n    const byTag = {}; alliances.forEach(a=>byTag[a.tag]=a);\n    const cmdPool = [\n      {n:'Sablewing', t:'Cavalry', r:'Legendary'}, {n:'Ironhelm', t:'Infantry', r:'Legendary'},\n      {n:'Stormcaller', t:'Archer', r:'Legendary'}, {n:'Duskblade', t:'Cavalry', r:'Legendary'},\n      {n:'Wyrmsbane', t:'Leadership', r:'Legendary'}, {n:'Ashbringer', t:'Archer', r:'Legendary'},\n      {n:'Frostmantle', t:'Infantry', r:'Legendary'}, {n:'Emberhall', t:'Cavalry', r:'Legendary'},\n      {n:'Stonewarden', t:'Infantry', r:'Legendary'}, {n:'Skystrider', t:'Archer', r:'Legendary'},\n      {n:'Gilead', t:'Leadership', r:'Legendary'}, {n:'Thornguard', t:'Infantry', r:'Epic'},\n      {n:'Ravenor', t:'Cavalry', r:'Epic'}, {n:'Nightsworn', t:'Archer', r:'Epic'},\n      {n:'Vanguard', t:'Infantry', r:'Epic'}, {n:'Greycloak', t:'Leadership', r:'Epic'},\n    ];\n    const weights = {WW85:14, VLOR:9, IRON:8, DAWN:7, HORD:6, NOVA:5};\n    const wpool = []; alliances.forEach(a=>{ for(let k=0;k<weights[a.tag];k++) wpool.push(a.tag); });\n    const scans = [\n      {label:'May 02', sub:'KvK Start'},\n      {label:'May 09', sub:''},\n      {label:'May 16', sub:''},\n      {label:'May 23', sub:''},\n      {label:'May 30', sub:''},\n      {label:'Jun 06', sub:''},\n      {label:'Jun 13', sub:'Latest'},\n    ];\n    const NS = scans.length, days = 30;\n    const ease = t => 1 - Math.pow(1-t, 1.7);\n    const govs = [];\n    for(let i=0;i<48;i++){\n      const tag = wpool[Math.floor(rnd()*wpool.length)];\n      const r1 = rnd();\n      const power0 = Math.round((40 + Math.pow(r1,0.62)*96) * 1e6);\n      const t5 = Math.round((2 + Math.pow(rnd(),0.8)*27) * 1e6);\n      const t4 = Math.round(t5 * (1.4 + rnd()*1.1));\n      const t3 = Math.round(t4 * (1.2 + rnd()*0.8));\n      const t2 = Math.round(t3 * (1.3 + rnd()*0.7));\n      const t1 = Math.round(t2 * (1.5 + rnd()*0.9));\n      const kpTotal = Math.round(t1*0.2 + t2*0.5 + t3*1 + t4*4 + t5*10);\n      const deathsTotal = Math.round((1.2 + Math.pow(rnd(),0.9)*36) * 1e6);\n      const kvkKpFrac = 0.12 + rnd()*0.33;\n      const kvkDeathFrac = 0.18 + rnd()*0.5;\n      const kpStart = Math.round(kpTotal * (1 - kvkKpFrac));\n      const deathsStart = Math.round(deathsTotal * (1 - kvkDeathFrac));\n      const powerStart = Math.round(power0 * (0.9 - rnd()*0.05));\n      const hist = [];\n      for(let d=0; d<days; d++){ const t = d/(days-1); let v = powerStart + (power0-powerStart)*t; v *= 1 + (rnd()-0.5)*0.012; hist.push(Math.round(v)); }\n      const drop = (i%8===3) || (i%13===6);\n      if(drop){ const ls = 23 + Math.floor(rnd()*3); const peak = hist[ls]; const loss = peak*(0.045 + rnd()*0.075); for(let d=ls; d<days; d++){ hist[d] = Math.round(peak - loss*((d-ls)/((days-1-ls)||1))); } }\n      const power = hist[days-1];\n      const series = [];\n      for(let s=0;s<NS;s++){ const t=s/(NS-1); const e=ease(t); series.push({ power: hist[Math.round(t*(days-1))], kp: Math.round(kpStart + (kpTotal-kpStart)*e), deaths: Math.round(deathsStart + (deathsTotal-deathsStart)*e) }); }\n      const reqTarget = Math.round(power*2.55 + 18e6);\n      // ---- Hall of Heroes (commanders) ----\n      const nCmd = 4 + Math.floor(rnd()*3);\n      const cmds = []; const usedC = {};\n      for(let c=0;c<nCmd;c++){ let idx; let guard=0; do{ idx=Math.floor(rnd()*cmdPool.length); guard++; }while(usedC[idx] && guard<40); usedC[idx]=1; const base=cmdPool[idx]; const lvl = base.r==='Legendary' ? (55+Math.floor(rnd()*7)) : (48+Math.floor(rnd()*12)); const exp = base.r==='Legendary' ? Math.floor(Math.pow(rnd(),0.8)*5) : 0; cmds.push({ name:base.n, type:base.t, rarity:base.r, level:lvl, expertise:exp, skills:Math.min(5, 2+Math.floor(rnd()*4)) }); }\n      cmds.sort((a,b)=> (b.rarity==='Legendary'?1:0)-(a.rarity==='Legendary'?1:0) || b.level-a.level);\n      const legendaryCount = cmds.filter(c=>c.rarity==='Legendary').length;\n      const expertised = cmds.filter(c=>c.expertise>=4).length;\n      // ---- activity status ----\n      const back = Math.max(0, NS-3);\n      const recentKpGain = series[NS-1].kp - series[back].kp;\n      const recentDeathGain = series[NS-1].deaths - series[back].deaths;\n      const recentPowChange = series[NS-1].power - series[NS-2].power;\n      let status='active', lastActive=NS-1; const actRoll = rnd();\n      if(drop && recentPowChange < -power*0.02){ status='migrated'; lastActive=NS-1; }\n      else if(actRoll < 0.15){ status='inactive'; lastActive=back; }\n      else if(actRoll < 0.33){ status='low'; lastActive=NS-2; }\n      const linked = rnd() > 0.2;\n      const honor = Math.round((kpTotal*0.05 + deathsTotal*0.5) * (0.7 + rnd()*0.6));\n      const prekvk = Math.round((18 + Math.pow(rnd(),0.85)*210) * 1e6);\n      const rssGathered = Math.round((120 + rnd()*2100)*1e6);\n      govs.push({ id:'1685'+(100000 + (i*7919)%899999), name:names[i], tag, power, kpTotal, deathsTotal, t1,t2,t3,t4,t5, reqTarget, hist, series, rss: Math.round((50 + rnd()*920)*1e6), assist: Math.round((10 + rnd()*320)*1e6), helps: Math.round(200 + rnd()*4200), cmds, legendaryCount, expertised, status, lastActive, linked, honor, prekvk, rssGathered });\n    }\n    // assign roles by current power within WW85\n    const ww = govs.filter(g=>g.tag==='WW85').sort((a,b)=>b.power-a.power);\n    ww.forEach((g,idx)=>{ g.role = idx===0 ? 'R5 · King' : idx<4 ? 'R4 · Officer' : 'Member'; });\n    govs.forEach(g=>{ if(!g.role) g.role = 'Member'; });\n    const enemyKingdoms = [\n      { kd:'1685', name:'Warriors of Wanna', tag:'WW85', us:true, f:1.0, color:'#5cb4dd' },\n      { kd:'2042', name:'Frostmark Pact', tag:'FMP', f:0.9, color:'#8493a6' },\n      { kd:'2756', name:'Sunspear Dominion', tag:'SUN', f:0.96, color:'#c79a52' },\n      { kd:'3311', name:'Crimson Aegis', tag:'CRA', f:0.81, color:'#b06a72' },\n    ];\n    return { governors: govs, alliances, byTag, scans, days, enemyKingdoms };\n  }\n\n  _line(vals, w, h, padL, padR, padT, padB){\n    w=w||1000; h=h||250; padL=padL||4; padR=padR||4; padT=padT||14; padB=padB||10;\n    const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);\n    const span = (max-min)||1, iw = w-padL-padR, ih = h-padT-padB, n = vals.length;\n    const pts = vals.map((v,i)=>({ x: padL + (n>1 ? i/(n-1):0)*iw, y: padT + ih - ((v-min)/span)*ih, v }));\n    const path = pts.map((p,i)=>(i?'L':'M')+p.x.toFixed(1)+' '+p.y.toFixed(1)).join(' ');\n    const area = path + ' L '+pts[n-1].x.toFixed(1)+' '+(padT+ih).toFixed(1)+' L '+pts[0].x.toFixed(1)+' '+(padT+ih).toFixed(1)+' Z';\n    return { path, area, pts, min, max, last: pts[n-1], baseY: padT+ih, padT };\n  }\n\n  // ---- navigation / interaction ----\n  _set(p){ this.setState(p); }\n  renderVals(){\n    const S = this.state, D = this._data, G = D.governors, scans = D.scans, NS = scans.length;\n    const si = Math.min(S.scanIdx, NS-1);\n    const enemyTag = '2042';\n\n    const nav = {\n      navDashboard: () => this._set({view:'dashboard'}),\n      navLeaderboard: () => this._set({view:'leaderboard'}),\n      navGovernors: () => this._set({view:'governors'}),\n      navKvk: () => this._set({view:'kvk'}),\n      navAlliances: () => this._set({view:'alliances'}),\n      navCommanders: () => this._set({view:'commanders'}),\n      navMembers: () => this._set({view:'members'}),\n      navHonor: () => this._set({view:'honor'}),\n      navMultiKvk: () => this._set({view:'multikvk'}),\n      navResources: () => this._set({view:'resources'}),\n      navActivity: () => this._set({view:'activity'}),\n      navScans: () => this._set({view:'scans'}),\n      navDkpLab: () => this._set({view:'dkplab'}),\n      openGov: (id) => this._set({view:'profile', selectedGov:id}),\n      onSearch: (e) => thi
