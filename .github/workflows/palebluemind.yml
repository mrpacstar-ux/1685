# Pale Blue Mind — unattended autopilot.
# Produces and publishes videos on a schedule with no human in the loop.
# Logic lives entirely in youtube/; this workflow is just the scheduler.
#
# Setup: add these repo secrets (Settings → Secrets and variables → Actions):
#   ANTHROPIC_API_KEY            (required)
#   TTS_PROVIDER + the matching TTS key (ELEVENLABS_API_KEY/ELEVENLABS_VOICE_ID
#                                or OPENAI_API_KEY) — for narration
#   PEXELS_API_KEY               — for B-roll
#   YOUTUBE_CLIENT_ID / YOUTUBE_CLIENT_SECRET / YOUTUBE_REFRESH_TOKEN — to upload
#   YOUTUBE_PUBLISH_TZ_OFFSET    (optional, e.g. -05:00)
# Publish mode defaults to "scheduled" (upload private, auto-publish at slot time).

name: Pale Blue Mind autopilot

on:
  schedule:
    - cron: "0 14 * * *" # daily at 14:00 UTC
  workflow_dispatch:
    inputs:
      count:
        description: "How many videos to produce + publish this run"
        default: "1"
      theme:
        description: "Optional theme to steer idea generation"
        default: ""

permissions:
  contents: read

concurrency:
  group: palebluemind-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: youtube
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: youtube/package-lock.json

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Run autopilot
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TTS_PROVIDER: ${{ secrets.TTS_PROVIDER }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_PUBLISH_TZ_OFFSET: ${{ secrets.YOUTUBE_PUBLISH_TZ_OFFSET }}
          PBM_PUBLISH_MODE: scheduled
        run: npm run autopilot -- --count "${{ github.event.inputs.count || '1' }}" ${{ github.event.inputs.theme && format('--theme "{0}"', github.event.inputs.theme) || '' }}

      - name: Upload produced packages (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pbm-packages-${{ github.run_id }}
          path: youtube/out/
          if-no-files-found: ignore
          retention-days: 14
