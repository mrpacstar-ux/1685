name: Build psa-diag Windows executable

on:
  push:
    branches: [ claude/peugeot-diagnostic-scanner-vs6jn0 ]
    paths: [ 'peugeot-diag/**' ]
    tags: [ 'psa-diag-v*' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: peugeot-diag
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyinstaller pyserial

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build standalone GUI executable
        run: >
          pyinstaller --onefile --windowed --name psa-diag
          --collect-submodules psadiag --collect-submodules serial
          --noconfirm --clean launch.py

      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: psa-diag-windows
          path: peugeot-diag/dist/psa-diag.exe
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: peugeot-diag/dist/psa-diag.exe
